# =============================================================================
# ZYRA — Nginx Configuration for ceozyra.com
# All subdomains properly routed to their respective services
# =============================================================================

# ---- HTTP → HTTPS redirects for ALL subdomains ----

server {
    listen 80;
    listen [::]:80;
    server_name ceozyra.com www.ceozyra.com;
    client_max_body_size 50M;
    satisfy any;
    allow all;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

