# =============================================================================
# ZYRA — Wildcard Storefront Nginx Configuration
# =============================================================================
#
# Purpose:
#   Catches all *.ceozyra.com subdomains and routes them to the Next.js web
#   app (port 3020) or the API backend (port 4020) for storefront data.
#   Each subdomain slug is forwarded as X-Storefront-Host so the app can
#   resolve the tenant/store before rendering.
#
# Inclusion:
#   Include this file from the main nginx.conf (or conf.d/ default):
#     include /var/www/zyra/infrastructure/nginx/conf.d/*.conf;
#
# SSL:
#   Uses the standard Let's Encrypt cert for ceozyra.com which covers
#   all subdomains via SAN/wildcard.
#
# Rate Limiting (defined in http context of the main nginx.conf):
#   zone storefront_zone $binary_remote_addr  zone=10m  rate=10r/s;
#   zone storefront_api  $binary_remote_addr  zone=10m  rate=30r/s;
#   zone storefront_write $binary_remote_addr zone=5m  rate=2r/s;
#
# =============================================================================

# ---- HTTP → HTTPS redirect for wildcard subdomains ----

server {
    listen 80;
    listen [::]:80;
    server_name *.ceozyra.com;

    client_max_body_size 50M;

    # Let certbot validate per-domain if needed
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS — Wildcard Storefront (*.ceozyra.com) ----

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.ceozyra.com;

    # ---- SSL ----
    ssl_certificate     /etc/letsencrypt/live/ceozyra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ceozyra.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # TLS hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers   ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    # ---- Security headers ----
    add_header X-Frame-Options          "SAMEORIGIN"              always;
    add_header X-XSS-Protection         "1; mode=block"            always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options   "nosniff"                  always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

    # ---- Extract subdomain slug and pass as header ----
    # $host = <slug>.ceozyra.com  →  slug = ${host%%.ceozyra.com}
    map $host $storefront_slug {
        ~^(?<sub>[^.]+)\.ceozyra\.com$  $sub;
        default                         "";
    }

    # ---- Static storefront assets (cached aggressively) ----
    location ~* ^/_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable, stale-while-revalidate=60";
        add_header X-Storefront-Slug $storefront_slug always;
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Storefront-Host $storefront_slug;
        proxy_read_timeout  60s;
        proxy_connect_timeout 10s;
    }

    # ---- User-uploaded storefront assets ----
    location ~* ^/storefront-assets/ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Storefront-Slug $storefront_slug always;
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Storefront-Host $storefront_slug;
        proxy_read_timeout  60s;
        proxy_connect_timeout 10s;
    }

    # ---- Storefront page loads (rate-limited, ISR-friendly) ----
    location / {
        limit_req zone=storefront_zone burst=20 nodelay;

        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Storefront-Host $storefront_slug;

        proxy_read_timeout       60s;
        proxy_connect_timeout    10s;
        proxy_send_timeout       60s;

        # WebSocket / SSE upgrade support
        proxy_http_version 1.1;
        proxy_set_header Upgrade   $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# ---- HTTPS — Storefront API sub-path (proxied to API backend) ----
# Called by storefront JS for data; separate rate limit zone.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.ceozyra.com;

    ssl_certificate     /etc/letsencrypt/live/ceozyra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ceozyra.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    add_header X-Frame-Options          "SAMEORIGIN"              always;
    add_header X-XSS-Protection         "1; mode=block"            always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options   "nosniff"                  always;

    map $host $storefront_slug {
        ~^(?<sub>[^.]+)\.ceozyra\.com$  $sub;
        default                         "";
    }

    # Storefront API proxy — higher rate limit for data reads
    location /storefront-api/ {
        limit_req zone=storefront_api burst=60 nodelay;

        proxy_pass http://127.0.0.1:4020/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Storefront-Host $storefront_slug;

        proxy_read_timeout  30s;
        proxy_connect_timeout 10s;
    }

    # Write operations (cart, checkout) — very strict rate limit
    location /storefront-api/cart     { limit_req zone=storefront_write burst=5 nodelay; rewrite ^/storefront-api/(.*) /$1 break; proxy_pass http://127.0.0.1:4020; }
    location /storefront-api/checkout { limit_req zone=storefront_write burst=5 nodelay; rewrite ^/storefront-api/(.*) /$1 break; proxy_pass http://127.0.0.1:4020; }
}

# ---- map block for WebSocket upgrade (must be in http context, here for reference) ----
# Add this to the http {} block of your main nginx.conf:
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
#
# And add the rate limit zones:
#
#   limit_req_zone $binary_remote_addr zone=storefront_zone:10m  rate=10r/s;
#   limit_req_zone $binary_remote_addr zone=storefront_api:10m   rate=30r/s;
#   limit_req_zone $binary_remote_addr zone=storefront_write:5m  rate=2r/s;
